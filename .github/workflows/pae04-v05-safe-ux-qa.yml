name: PAE-04 v05 SAFE UX synthetic browser QA (no publish)
on:
  push:
    branches: [sandbox/pae04-v05-safe-ux]
    paths:
      - 'qa/v05-safe-ux/**'
      - '.github/workflows/pae04-v05-safe-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original immutable v04.1 site
        run: python qa/v04-safe-upgrade/verify_v04.py
      - name: Verify v05 uses same DB and backup format and has exactly 9 site files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('qa/v05-safe-ux/site')
          base=Path('qa/v04-safe-upgrade/site')
          fs={str(p.relative_to(source)) for p in source.rglob('*') if p.is_file()}
          expected={'index.html','app.js','styles.css','sw.js','manifest.webmanifest','icons/icon.svg','icons/apple-touch-icon.png','icons/icon-192.png','icons/icon-512.png'}
          assert fs==expected,(fs^expected)
          old=(base/'app.js').read_text()
          new=(source/'app.js').read_text()
          for needle in ["const DB_NAME='PAE04_HT_STABLE_CANDIDATE_INTEGRATION_SYNTHETIC_SCHEMA1'","const DB_VERSION=1","const STORE_NAMES=['pressures','medications','intakes','intakeEvents']","const BACKUP_VERSION=3","function atomicMerge(data)"]:
              assert needle in new and needle in old,needle
          for name in ['icons/icon.svg','icons/apple-touch-icon.png','icons/icon-192.png','icons/icon-512.png']:
              assert (source/name).read_bytes()==(base/name).read_bytes(),name
          assert 'v05' in (source/'index.html').read_text()
          assert 'cache-v05-' in (source/'sw.js').read_text()
          print('RESULT=PASS V05_SITE_FILES=9 SAME_DB_AND_BACKUP=True SYNTHETIC_ONLY=True')
          PY
      - name: Install Playwright 1.65.0 browsers
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Run original 25-check v04 regression against v05
        run: python qa/v05-safe-ux/tests/browser_e2e.py ${{ matrix.engine }}
      - name: Run v05 safe-UX mobile and filter checks
        run: python qa/v05-safe-ux/tests/v05_ux.py ${{ matrix.engine }}
      - name: Retain synthetic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v05-safe-ux-${{ matrix.engine }}
          path: qa/v05-safe-ux/reports/
          if-no-files-found: warn
          retention-days: 14
