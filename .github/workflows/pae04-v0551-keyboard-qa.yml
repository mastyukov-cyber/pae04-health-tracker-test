name: PAE-04 v05.5.1 iPhone Keyboard UX QA (synthetic only; NO DEPLOY)
on:
  push:
    branches: [sandbox/pae04-v0551-keyboard-ux]
    paths:
      - 'qa/v0551-keyboard-ux/**'
      - '.github/workflows/pae04-v0551-keyboard-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard-ux:
    name: Keyboard UX and Data Safety regression ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 9 exact SHA-256 hashes and immutable medical schema
        run: python qa/v0551-keyboard-ux/verify.py
      - name: Check Javascript syntax
        run: node --check qa/v0551-keyboard-ux/site/app.js
      - name: Install Playwright 1.65.0 and browser
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: New focus, keyboard-nav, autocomplete, and save/blur regression
        run: python qa/v0551-keyboard-ux/tests/keyboard_ux.py ${{ matrix.engine }}
      - name: Existing 25-check offline and IndexedDB regression
        run: python qa/v0551-keyboard-ux/tests/browser_e2e.py ${{ matrix.engine }}
      - name: Existing 9-check pressure and medicine filter regression
        run: python qa/v0551-keyboard-ux/tests/v05_ux.py ${{ matrix.engine }}
      - name: Existing 29-check responsive mobile geometry regression
        run: python qa/v0551-keyboard-ux/tests/mobile_geometry.py ${{ matrix.engine }}
      - name: Existing 14-check search and JSON backup regression
        run: python qa/v0551-keyboard-ux/tests/v052_features.py ${{ matrix.engine }}
      - name: Existing 22-check Safari zoom and editable font regression
        run: python qa/v0551-keyboard-ux/tests/zoom_focus.py ${{ matrix.engine }}
      - name: Existing 20-check wheel date picker regression
        run: python qa/v0551-keyboard-ux/tests/date_wheels.py ${{ matrix.engine }}
      - name: Existing 27-check Data Safety / 10 version migration regression
        run: python qa/v0551-keyboard-ux/tests/data_safety.py ${{ matrix.engine }}
      - name: Archive synthetic QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v0551-keyboard-${{ matrix.engine }}
          path: qa/v0551-keyboard-ux/reports/
          if-no-files-found: warn
          retention-days: 14
