name: PAE-04 v05.3 Safari Input Zoom QA (synthetic only; NO DEPLOY)
on:
  push:
    branches: [sandbox/pae04-v053-safari-input-zoom]
    paths:
      - 'qa/v053-safari-input-zoom/**'
      - '.github/workflows/pae04-v053-safari-input-zoom-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-zoom-qa:
    name: Safari input zoom and original regression ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned 9 SHA256 resources and user pinch-to-zoom
        run: python qa/v053-safari-input-zoom/verify.py
      - name: Verify unchanged JavaScript syntax
        run: node --check qa/v053-safari-input-zoom/site/app.js
      - name: Install Playwright 1.65.0 for synthetic UI verification
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Preserved 25-check persistence and offline regression
        run: python qa/v053-safari-input-zoom/tests/browser_e2e.py ${{ matrix.engine }}
      - name: Preserved 9-check v05 read-only filters regression
        run: python qa/v053-safari-input-zoom/tests/v05_ux.py ${{ matrix.engine }}
      - name: Preserved 29-check geometry regression
        run: python qa/v053-safari-input-zoom/tests/mobile_geometry.py ${{ matrix.engine }}
      - name: Preserved 14-check v05.2 journal and backup regression
        run: python qa/v053-safari-input-zoom/tests/v052_features.py ${{ matrix.engine }}
      - name: New mobile emulation focus inputs >=16px without restricting pinch-zoom
        run: python qa/v053-safari-input-zoom/tests/zoom_focus.py ${{ matrix.engine }}
      - name: Save synthetic browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v053-zoom-${{ matrix.engine }}
          path: qa/v053-safari-input-zoom/reports/
          if-no-files-found: warn
          retention-days: 14
