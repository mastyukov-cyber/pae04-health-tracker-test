name: PAE-04 v03 real UI to v04.1 synthetic migration QA
on:
  push:
    branches:
      - sandbox/pae04-v05-bridge-qa
    paths:
      - 'qa/v05-bridge-qa/**'
      - '.github/workflows/pae04-v05-bridge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v03-to-v041-bridge:
    name: v03 UI → v04.1 · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v02 source and reconstruct exact v03 application UI
        run: |
          python qa/integration-v02-browser/verify-extract.py
          python qa/integration-v03-browser/verify-build-v03.py
      - name: Verify unchanged v04.1 application files
        run: python qa/v04-safe-upgrade/verify_v04.py
      - name: Install verified Playwright browsers
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Real old UI export and new UI checkpoint restore
        run: python qa/v05-bridge-qa/real_v03_to_v041.py ${{ matrix.engine }}
      - name: Check diagnostic report files exist
        if: always()
        run: |
          test -s qa/v05-bridge-qa/reports/${{ matrix.engine }}.log
          test -s qa/v05-bridge-qa/reports/${{ matrix.engine }}.json
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v05-v03-ui-v041-${{ matrix.engine }}
          path: qa/v05-bridge-qa/reports/
          if-no-files-found: error
          retention-days: 14
