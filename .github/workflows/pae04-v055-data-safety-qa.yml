name: PAE-04 v05.5 Data Safety Gate QA (synthetic only; NO DEPLOY)
on:
  push:
    branches: [sandbox/pae04-v055-data-safety-gate]
    paths:
      - 'qa/v055-data-safety/**'
      - '.github/workflows/pae04-v055-data-safety-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-gate:
    name: IndexedDB/backup/upgrade safety ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exactly 9 SHA-256 resources and immutable schema
        run: python qa/v055-data-safety/verify.py
      - name: Check browser JS syntax
        run: node --check qa/v055-data-safety/site/app.js
      - name: Install Playwright 1.65.0 engine
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Preserved 25-check SW offline and IndexedDB regression
        run: python qa/v055-data-safety/tests/browser_e2e.py ${{ matrix.engine }}
      - name: Preserved 9-check UX filters regression
        run: python qa/v055-data-safety/tests/v05_ux.py ${{ matrix.engine }}
      - name: Preserved 29-check mobile geometry regression
        run: python qa/v055-data-safety/tests/mobile_geometry.py ${{ matrix.engine }}
      - name: Preserved 14-check journal and backup verifier regression
        run: python qa/v055-data-safety/tests/v052_features.py ${{ matrix.engine }}
      - name: Preserved 22-check iPhone font and no zoom regression
        run: python qa/v055-data-safety/tests/zoom_focus.py ${{ matrix.engine }}
      - name: Preserved date picker leap years, audit, export and mobile regression
        run: python qa/v055-data-safety/tests/date_wheels.py ${{ matrix.engine }}
      - name: Data safety gate - readback, corruption, cross-origin restore, 10 version swaps
        run: python qa/v055-data-safety/tests/data_safety.py ${{ matrix.engine }}
      - name: Upload synthetic QA evidence, no patient data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v055-data-safety-${{ matrix.engine }}
          path: qa/v055-data-safety/reports/
          if-no-files-found: warn
          retention-days: 14
