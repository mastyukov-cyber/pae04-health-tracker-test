name: PAE-04 HOME24 — owner approved synthetic iPhone preview on cyber Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pae04-home24-cyber-preview-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-test-site-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'mastyukov-cyber/pae04-health-tracker-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout cyber main, no write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact HOME24 Chrome PASS-scoped QA source (read-only)
        uses: actions/checkout@v4
        with:
          repository: mastyukov-cyber/pae04-health-tracker-test
          ref: 70314d306d50d31b7703c49fe3077038b651243c
          path: home24-source
          persist-credentials: false
      - name: SHA preflight pinned source, original TEST release and guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mastyukov-cyber/pae04-health-tracker-test"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE/home24-source" -C home24-source rev-parse HEAD)" = "70314d306d50d31b7703c49fe3077038b651243c"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE/home24-source" -C home24-source hash-object qa/home24/stage_cp41.py)" = "f085a859c140710fbe00908500d5088b386269c6"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE/home24-source" -C home24-source hash-object qa/home24/strict_preflight.js)" = "a85037a475d5ec312f9e9c97541b58491070b828"
          echo "0abb256031187036e8d282eaedc08ffaf970e9de1cffd7cda7814cc84fb8c4cb  release/health-tracker-test.zip" | sha256sum -c -
      - name: Reuse prior HOME24 QA-tested staging from pinned CP41 (NO QA rerun)
        shell: bash
        run: |
          set -euo pipefail
          python3 home24-source/qa/home24/stage_cp41.py
      - name: Preserve TEST and CP40/CP41 byte-for-byte; add HOME24 only after exact SHA gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,urllib.request,urllib.parse,time,shutil,re
          ROOT=Path("dist")
          ROOT.mkdir(exist_ok=False)
          OUT=Path("qa-evidence")
          OUT.mkdir(exist_ok=False)
          BASE="https://mastyukov-cyber.github.io/pae04-health-tracker-test/"
          CP40=json.loads(r'''{"PREVIEW_PROVENANCE.json":"16cfb285832c5644942c0dedb1370ab4edd0ac61173b0911d68b4524e457899f","app.js":"9178c790d4fc0d89dffd89964c4515ba4bbd2819ac8016c025b78bb5a69c8c97","home.css":"09893b19ca639fc43c7cfd82f95e3c75b759956f7f932db934863b1e5f78334a","home.js":"f455b88de7f7c8c388b20516839bcc8f1b0d5cfb204d7562dfc43f62740856b2","icons/apple-touch-icon.png":"7e321de521f7c91a8856a66e237b98bb48d36bc89c6246ab90cc0ffb4ce6e11b","icons/icon-192.png":"455b1aa541ebd7574d441d82615efd6f02d277c2ecf727077aa274fbbbe74f05","icons/icon-512.png":"b5509bdf65dc021a057dac3f6db52de87a5d13d64c34cdc5f8dfc677a4e4f18b","icons/icon.svg":"377cd4fa7b4ff64ecd8d4157a9aacc67aaedcede7b39b2f4082e60a0c3b1d606","index.html":"fbf8337ba6fb9e26ffb904e0530331bb5dd7bb32a6bddfc1834d89363244e4d6","manifest.webmanifest":"d024327ff2a516a92092931e5f9ad303744bd529f5ef2e5084316ffc4e3cdf94","med_guard.css":"4b606c41bfee2be98ffd90123bc55c19f00888c0c3e18ff2f618ab0e18276389","med_guard.mjs":"ff522082f976086884e23fdf493dbbf02416152ca10644c38cd6a3359c03c413","med_matcher.mjs":"216b1cdc709d29147eba923973f530ef27c89b5422859c91dac74453666ccd08","offline_status.js":"0efe9577c7a2331e98bb9dcafec0d1181a5080ceabea6514cf4ff3db228de560","personal_adapter.js":"38375dfb354ba4e3393b4d9c8d1fe7c18ac76f2b918ba9ac5f9e90babc334a4c","personal_profile.json":"4a61bf63f5d4f8100208fabd925d8b589da95934356976c55ccfae546357be88","robots.txt":"331ea9090db0c9f6f597bd9840fd5b171830f6e0b3ba1cb24dfa91f0c95aedc1","styles.css":"5c4d697d37335fb808ddd688716a93c35fbd14d11d62a79719724dfb7c8b8c2e","sw.js":"1885336875fdc94a7e690efd4ecc168d1d40f56c38747aae7cbf4ae800ffd3fe"}''')
          CP41=json.loads(r'''{"PREVIEW_PROVENANCE.json":"2578c7a1d225f369953a81a11091d570910b301aeadd49f4797f67ffb1822d32","app.js":"255f383826123658ec7ebdde385781a570f0df698d55c31b2e5e871c8ea085d6","home.css":"09893b19ca639fc43c7cfd82f95e3c75b759956f7f932db934863b1e5f78334a","home.js":"f455b88de7f7c8c388b20516839bcc8f1b0d5cfb204d7562dfc43f62740856b2","icons/apple-touch-icon.png":"7e321de521f7c91a8856a66e237b98bb48d36bc89c6246ab90cc0ffb4ce6e11b","icons/icon-192.png":"455b1aa541ebd7574d441d82615efd6f02d277c2ecf727077aa274fbbbe74f05","icons/icon-512.png":"b5509bdf65dc021a057dac3f6db52de87a5d13d64c34cdc5f8dfc677a4e4f18b","icons/icon.svg":"377cd4fa7b4ff64ecd8d4157a9aacc67aaedcede7b39b2f4082e60a0c3b1d606","index.html":"995fef930c5ce7478db14d1f1ae3f9108327f9ce5cd14309a720c87c5df599f2","manifest.webmanifest":"d024327ff2a516a92092931e5f9ad303744bd529f5ef2e5084316ffc4e3cdf94","med_guard.css":"4b606c41bfee2be98ffd90123bc55c19f00888c0c3e18ff2f618ab0e18276389","med_guard.mjs":"ff522082f976086884e23fdf493dbbf02416152ca10644c38cd6a3359c03c413","med_matcher.mjs":"216b1cdc709d29147eba923973f530ef27c89b5422859c91dac74453666ccd08","offline_status.js":"0eec48f511533769447b2ddb688a555f24e890ad3f2ff5754239f8e82f101cfe","personal_adapter.js":"38375dfb354ba4e3393b4d9c8d1fe7c18ac76f2b918ba9ac5f9e90babc334a4c","personal_profile.json":"4a61bf63f5d4f8100208fabd925d8b589da95934356976c55ccfae546357be88","robots.txt":"331ea9090db0c9f6f597bd9840fd5b171830f6e0b3ba1cb24dfa91f0c95aedc1","styles.css":"5c4d697d37335fb808ddd688716a93c35fbd14d11d62a79719724dfb7c8b8c2e","sw.js":"23508c9c7415ff57a722b856542dbff72bf2a55d908e633f1ee94a389a6d0c25"}''')
          HOME_PINS=json.loads(r'''{"app.js":"882ea9bdf29cbc1365e639348a2b83c76c6b2d94105908203d32c6db821706e3","index.html":"95e7a6612d59b81fcd8d3e77f6511b21d49ba6783c17968d0fad37d6e843baba","sw.js":"17dfe37a6e021b77b08c91bc2e663f813a11ca6cc147341058dd1b401c8eba76","offline_status.js":"1dba39e2a727f74e8f4d2e32e875d3b9c4ea32028d79cc1c7303346ae5fd0582","strict_preflight.js":"4fcee08c000764a9665eca30359cf53e2d04cf48fd88f05cd90213304bfb3d70","PREVIEW_PROVENANCE.json":"42f9132fd604731ae99e0818ca89e1e737cffb47363a37d2a0dd997491c9e759"}''')
          PIN_TEST=json.loads(r'''{".nojekyll":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","app.js":"36e8938498d992a6ccb6a73904ba15be4adfd2c2e07ebf079274630f819143bd","home.css":"922d3c9fe41be8e46d259bcc89f29098a22d4fa4480961c3342f4404b68f155d","home.js":"1df9ae2e61dd8c626d3927b8f9a052249a0e40744670654bd7fb23c89fb15da1","icons/apple-touch-icon.png":"7e321de521f7c91a8856a66e237b98bb48d36bc89c6246ab90cc0ffb4ce6e11b","icons/icon-192.png":"455b1aa541ebd7574d441d82615efd6f02d277c2ecf727077aa274fbbbe74f05","icons/icon-512.png":"b5509bdf65dc021a057dac3f6db52de87a5d13d64c34cdc5f8dfc677a4e4f18b","icons/icon.svg":"377cd4fa7b4ff64ecd8d4157a9aacc67aaedcede7b39b2f4082e60a0c3b1d606","index.html":"d14432b9bf9f728d63c55c96368f66a1aab1655281e1deeeb52bec71ef585291","manifest.webmanifest":"fd9cbf6fc245b82730b9d6ae9b919a857dd685c47a10062312b53d2058ec36cf","med_guard.css":"4b606c41bfee2be98ffd90123bc55c19f00888c0c3e18ff2f618ab0e18276389","med_guard.mjs":"5aa603b10a15163865a460769c03f50574e63fb8db56b979661f77fef1f48ba8","med_matcher.mjs":"216b1cdc709d29147eba923973f530ef27c89b5422859c91dac74453666ccd08","offline_status.js":"8bf1c4c63cef748990c750d3d5cdcff278583efed5353abbfedbd577926efcd9","robots.txt":"331ea9090db0c9f6f597bd9840fd5b171830f6e0b3ba1cb24dfa91f0c95aedc1","styles.css":"bd5d4f42d6ee5ef285988345cf5cca3fe19ced911b6485c32f5f30f5d7b2ecfb","sw.js":"0945a188269432ec7b1ae96fb15c848cdde9294995e793bea3c3c0857118feed"}''')
          def sha(data):return hashlib.sha256(data).hexdigest()
          def fail(pred,msg):
           if not pred:raise SystemExit("STOP_FIRST PAE04 HOME24 "+msg)
          def bytesof(path):return path.read_bytes()
          def has(path,digest):return sha(bytesof(path))==digest
          def write(name,data):
           p=ROOT/name
           fail(not p.exists(),"target already exists "+name)
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_bytes(data)
          def fetch(path,pin):
           u=BASE+urllib.parse.quote(path,safe="/")
           err=None
           for attempt in range(5):
            try:
             with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"PAE04-HOME24-OWNER-APPROVED-PUBLISH"}),timeout=30) as resp:
              fail(resp.status==200,"HTTP source "+path)
              data=resp.read(1000001)
             fail(len(data)<=1000000,"unexpected source size "+path)
             fail(sha(data)==pin,"source SHA drift "+path)
             return data
            except Exception as e:
             err=e
             if attempt<4:time.sleep(2)
           raise SystemExit("STOP_FIRST fetch "+path+": "+str(err))
          zip_path=Path("release/health-tracker-test.zip")
          fail(has(zip_path,"0abb256031187036e8d282eaedc08ffaf970e9de1cffd7cda7814cc84fb8c4cb"),"TEST release ZIP source drift")
          with zipfile.ZipFile(zip_path) as z:
           fail(z.testzip() is None,"TEST ZIP CRC")
           entries=z.infolist()
           names=[entry.filename for entry in entries if not entry.is_dir()]
           allowed_dirs={str(Path(name).parent) for name in PIN_TEST if "/" in name}|{"."}
           fail(len(names)==len(PIN_TEST) and set(names)==set(PIN_TEST),"TEST ZIP file inventory drift")
           fail(len({entry.filename for entry in entries})==len(entries),"TEST ZIP duplicate entries")
           fail(all(not entry.is_dir() or
                    (not entry.filename.startswith("/") and
                     ".." not in Path(entry.filename).parts and
                     str(Path(entry.filename)) in allowed_dirs) for entry in entries),
                "TEST ZIP unexpected directory entry")
           for n in names:
            fail(not n.startswith("/") and ".." not in Path(n).parts,"unsafe TEST ZIP path "+n)
            b=z.read(n)
            fail(sha(b)==PIN_TEST[n],"TEST ZIP SHA drift "+n)
            write(n,b)
          for section,pins in (("cp40-iphone-preview",CP40),("cp41-sg01-iphone-preview",CP41)):
           for name,pin in pins.items():
            write(section+"/"+name,fetch(section+"/"+name,pin))
          # The prior successful QA-branch staging is reused; no Chromium/WebKit QA runs.
          STAGE=Path("home24-source/qa/home24/_staged_site")
          files={p.relative_to(STAGE).as_posix():p for p in STAGE.rglob("*") if p.is_file()}
          fail(len(files)==20,"HOME24 candidate file count")
          fail(set(CP41)|{"strict_preflight.js"}==set(files),"HOME24 candidate inventory not exactly 20 files")
          for name,h in HOME_PINS.items():fail(has(files[name],h),"HOME24 tested candidate SHA drift "+name)
          for name in set(CP41)-set(HOME_PINS):
           fail(has(files[name],CP41[name]),"HOME24 unchanged candidate SHA drift "+name)
          hindex=files["index.html"].read_text(encoding="utf-8")
          old="HOME-24 iPhone v2.3 · НЕ ОПУБЛИКОВАНО"
          new="HOME-24 iPhone v2.3 · ТЕСТОВЫЙ PREVIEW"
          fail(hindex.count(old)==1,"public preview banner source mismatch")
          replacement=hindex.replace(old,new,1).encode("utf-8")
          prov=json.loads(files["PREVIEW_PROVENANCE.json"].read_text(encoding="utf-8"))
          fail(prov.get("status")=="PREPARED_NOT_TESTED" and prov.get("publication")=="NOT_DEPLOYED","old provenance unexpected")
          prov["status"]="OWNER_APPROVED_CYBER_PREVIEW_ONLY"
          prov["publication"]="GITHUB_PAGES_TEST_ONLY"
          prov["approval"]="OWNER_APPROVED_PUBLISH_20261123"
          prov["qa_execution"]="PASS_SCOPED_CHROMIUM_138_138"
          prov["release"]="NO_GO"
          prov["security_gate"]="OPEN"
          for name,source in files.items():
           if name=="index.html":b=replacement
           elif name=="PREVIEW_PROVENANCE.json":b=(json.dumps(prov,ensure_ascii=False,indent=2)+"\n").encode("utf-8")
           else:b=source.read_bytes()
           write("home24-iphone-preview/"+name,b)
          app=(ROOT/"home24-iphone-preview/app.js").read_text(encoding="utf-8")
          guard=(ROOT/"home24-iphone-preview/strict_preflight.js").read_bytes()
          sw=(ROOT/"home24-iphone-preview/sw.js").read_text(encoding="utf-8")
          html=(ROOT/"home24-iphone-preview/index.html").read_text(encoding="utf-8")
          fail(sha(app.encode("utf-8"))==HOME_PINS["app.js"],"tested HOME24 app changed")
          fail(sha(guard)==HOME_PINS["strict_preflight.js"],"tested HOME23 guard changed")
          fail(sha(sw.encode("utf-8"))==HOME_PINS["sw.js"],"HOME24 SW changed")
          fail("const DB_NAME='PAE04_HOME24_SYNTHETIC_ISOLATED_DB_20261123';" in app,"isolated database missing")
          fail("pae04-home24-prep-isolated-static-" in sw and "pae04-cp41-sg01-isolated-static-" not in sw,"SW cache isolation failed")
          fail(html.count('id="pae04-public-preview-warning"')==1 and new in html,"public banner missing")
          fail('src="./strict_preflight.js" defer' in html and html.index('src="./strict_preflight.js" defer')<html.index('src="./app.js" defer'),"guard loading order changed")
          fail(app.count("parseExternalBackupJsonHOME24(await file.text())")==2,"both external file inputs not guarded")
          fail(json.loads((ROOT/"home24-iphone-preview/personal_profile.json").read_text(encoding="utf-8")).get("medicines")==[],"personal catalog present")
          fail("personalSeedDisabled:true" in (ROOT/"home24-iphone-preview/personal_adapter.js").read_text(encoding="utf-8"),"personal seed active")
          for name,h in PIN_TEST.items():fail(has(ROOT/name,h),"TEST changed during build "+name)
          for section,pins in (("cp40-iphone-preview",CP40),("cp41-sg01-iphone-preview",CP41)):
           for name,h in pins.items():fail(has(ROOT/section/name,h),section+" altered "+name)
          allfiles={p.relative_to(ROOT).as_posix():sha(bytesof(p)) for p in ROOT.rglob("*") if p.is_file()}
          fail(len(allfiles)==75,"published dist expected exactly 75 files")
          manifest={
           "checkpoint":"PAE-04 HOME24 GitHub Pages owner-approved synthetic iPhone preview",
           "status":"STAGED_FOR_PAGES","qa_scoped":"CHROMIUM_138_OF_138_PREVIOUS_SUCCESS_NO_RERUN",
           "qa_branch_head":"70314d306d50d31b7703c49fe3077038b651243c",
           "prior_cyber_main":"4e5403389232801a6dd3966542e8cdeece4f32a2",
           "test_root_files":17,"cp40_files":19,"cp41_files":19,"home24_files":20,
           "home23_guard_sha256":HOME_PINS["strict_preflight.js"],
           "source_home24_app_sha256":HOME_PINS["app.js"],
           "only_publication_text_differences":["home24-iphone-preview/index.html","home24-iphone-preview/PREVIEW_PROVENANCE.json"],
           "synthetic_only":True,"medical_data":False,"security_gate":"OPEN","release":"NO_GO",
           "files":allfiles}
          (OUT/"HOME24_BUILD_MANIFEST.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("HOME24_CYBER_PAGES_STAGE PASS",json.dumps({
           "files":len(allfiles),"TEST":17,"CP40":19,"CP41":19,"HOME24":20,
           "HOME24_APP_SHA256":allfiles["home24-iphone-preview/app.js"],
           "HOME24_GUARD_SHA256":allfiles["home24-iphone-preview/strict_preflight.js"],
           "HOME24_HTML_SHA256":allfiles["home24-iphone-preview/index.html"],
           "deploy":"GATED_ON_SUCCESS","release":"NO_GO"}))

          PY
      - name: Configure GitHub Pages after every SHA and privacy gate
        uses: actions/configure-pages@v5
      - name: Upload verified TEST, CP40, CP41 and HOME24 preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Save independent SHA manifest for post-deployment check
        uses: actions/upload-artifact@v4
        with:
          name: pae04-home24-cyber-sha-manifest
          path: qa-evidence/HOME24_BUILD_MANIFEST.json
          retention-days: 7

  publish:
    needs: package
    if: github.repository == 'mastyukov-cyber/pae04-health-tracker-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - name: Deploy exact SHA-verified existing Pages plus isolated HOME24
        id: pages
        uses: actions/deploy-pages@v4

  public-http-smoke:
    needs: publish
    if: github.repository == 'mastyukov-cyber/pae04-health-tracker-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch immutable manifest from this run only
        uses: actions/download-artifact@v4
        with:
          name: pae04-home24-cyber-sha-manifest
          path: qa-evidence
      - name: Independently read back 75/75 live HTTPS files (no browser QA rerun)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.parse,urllib.request,time,concurrent.futures
          manifest=json.loads(Path("qa-evidence/HOME24_BUILD_MANIFEST.json").read_text(encoding="utf-8"))
          files=manifest["files"]
          assert len(files)==75 and manifest["test_root_files"]==17
          assert manifest["home24_files"]==20 and manifest["cp40_files"]==19 and manifest["cp41_files"]==19
          BASE="https://mastyukov-cyber.github.io/pae04-health-tracker-test/"
          def check(item):
           name,want=item
           url=BASE+urllib.parse.quote(name,safe="/")
           reason=""
           for attempt in range(8):
            try:
             req=urllib.request.Request(url,headers={"User-Agent":"PAE04-HOME24-PUBLIC-SHA-READBACK","Cache-Control":"no-cache"})
             with urllib.request.urlopen(req,timeout=25) as r:
              if r.status!=200:raise ValueError("HTTP "+str(r.status))
              data=r.read(1000001)
             if len(data)>1000000:raise ValueError("content size >1MB")
             got=hashlib.sha256(data).hexdigest()
             if got!=want:raise ValueError("SHA MISMATCH "+name+" "+got)
             return name
            except Exception as e:
             reason=str(e)
             if attempt<7:time.sleep(3)
           raise RuntimeError("LIVE SHA DRIFT "+name+" "+reason)
          # Root/CP40/CP41 should stay byte-identical; verify every file after the release.
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
           results=list(pool.map(check,files.items()))
          assert set(results)==set(files)
          print("HOME24_CYBER_PUBLIC_HTTP PASS",json.dumps({
           "verified_files":len(results),"TEST":17,"CP40":19,"CP41":19,"HOME24":20,
           "sha":"75/75_MATCH","qa_previously":"138/138","release":"NO_GO"}))
          print("HOME24_URL https://mastyukov-cyber.github.io/pae04-health-tracker-test/home24-iphone-preview/index.html")

          PY
