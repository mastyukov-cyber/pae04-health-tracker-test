name: PAE-04 TEST v0.2.1 SAFE UPGRADE v04 HTTPS GitHub Pages (synthetic only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pae04-test-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-test-site-pages
  cancel-in-progress: false
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout immutable QA-approved v04 release snapshot
        uses: actions/checkout@v4
        with:
          ref: '2ba1e3eabbf90f174407784303344cf312675fae'
          persist-credentials: false
      - name: Verify all 9 v04 resources and stage ONLY synthetic TEST site
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/v04-safe-upgrade/verify_v04.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("qa/v04-safe-upgrade")
          source=root/"site"
          manifest=json.loads((root/"V04_MANIFEST.json").read_text(encoding="utf-8"))
          expected=manifest["target_files"]
          actual={str(p.relative_to(source)) for p in source.rglob("*") if p.is_file()}
          assert len(expected)==9 and actual==set(expected), "unexpected or missing site file"
          for name,digest in expected.items():
              assert hashlib.sha256((source/name).read_bytes()).hexdigest()==digest, "SHA256 mismatch: "+name
          html=(source/"index.html").read_text(encoding="utf-8")
          assert "PAE-04 · v0.2.1 SAFE UPGRADE TEST v04" in html
          assert "v0.2.1 · SAFE UPGRADE TEST v04 · OFFLINE-FIRST" in html
          assert "TEST v02" not in html and "TEST v03" not in html
          app=(source/"app.js").read_text(encoding="utf-8")
          assert "PAE04_HT_STABLE_CANDIDATE_INTEGRATION_SYNTHETIC_SCHEMA1" in app
          assert "Учебный препарат" in app
          print("RESULT=PASS VERSION=v04 FILES=9 SYNTHETIC_ONLY=True SOURCE_SHA=2ba1e3eabbf90f174407784303344cf312675fae")
          PY
          mkdir -p dist
          cp -R qa/v04-safe-upgrade/site/. dist/
          touch dist/.nojekyll
          find dist -type f | sort
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified v04 site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish only TEST Pages, not production PWA
        uses: actions/deploy-pages@v4
