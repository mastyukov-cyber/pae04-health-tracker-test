name: PAE-04 TEST v05.5 Safari Zoom Fix GitHub Pages (synthetic only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pae04-test-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-test-site-pages
  cancel-in-progress: false
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout immutable QA-approved v05.5 release snapshot
        uses: actions/checkout@v4
        with:
          ref: 'e50222c43190045902885ee8330bb8dbc6cf6e90'
          persist-credentials: false
      - name: Verify pinned v05.5 manifest and all 9 SHA256 resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qa/v055-data-safety/V055_MANIFEST.json)" = "d9c952c2ccc1cb9f1e23672f1e0546965d6cc875"
          test "$(git hash-object qa/v055-data-safety/verify.py)" = "9a5d29ab738b9c00cacbdf26efe97c9c05e0416e"
          python3 qa/v055-data-safety/verify.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa/v055-data-safety/site')
          manifest=json.loads(Path('qa/v055-data-safety/V055_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['version']=='v05.5'
          assert manifest['source_v054']=='aefffde27cc8bcd6d4922e724120fda4acd25c07'
          assert manifest['source_test_main']=='6bb1149fc69d8232fb7a4a253475213101f7b2ad'
          assert len(manifest['sha256'])==9
          html=(root/'index.html').read_text(encoding='utf-8')
          app=(root/'app.js').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          assert 'PAE-04 · v0.2.1 SAFE UX TEST v05.5' in html
          assert 'v0.2.1 · SAFE UX TEST v05.5 · OFFLINE-FIRST' in html
          assert 'id="pressure-search"' in html
          assert 'id="med-search"' in html
          assert 'id="verify-file"' in html
          assert 'JSON не зашифрован' in html
          assert "const DB_NAME='PAE04_HT_STABLE_CANDIDATE_INTEGRATION_SYNTHETIC_SCHEMA1'" in app
          assert "const DB_VERSION=1" in app
          assert "const STORE_NAMES=['pressures','medications','intakes','intakeEvents']" in app
          assert "const BACKUP_VERSION=3" in app
          assert 'function atomicMerge(data)' in app
          assert 'verifyDownloadedBackup' in app
          assert 'cache-v055-20261114' in sw
          assert 'id="data-safety-panel"' in html
          assert 'id="safety-check"' in html
          assert 'id="safety-copy-status"' in html
          assert 'id="wheel-modal"' in html
          assert 'data-wheel-target="pressure-datetime"' in html
          assert 'function verifyRecordAfterWrite(store,record)' in app
          assert 'async function verifyIntakeAudit(record,auditEvent)' in app
          assert 'function checkLocalIntegrity()' in app
          assert 'function safetyExternalBackupVerified(expected,contentMatches)' in app
          assert 'navigator.storage.persist(' not in app
          css=(root/'styles.css').read_text(encoding='utf-8')
          assert 'font-size: 16px !important;' in css
          assert 'input:not([type="checkbox"])' in css
          viewport=(root/'index.html').read_text(encoding='utf-8')
          assert 'width=device-width, initial-scale=1, viewport-fit=cover' in viewport
          assert 'user-scalable=no' not in viewport
          assert 'maximum-scale' not in viewport
          print('RESULT=PASS VERSION=v05.5 FILES=9 SHA256_VERIFIED=9 SYNTHETIC_ONLY=True SOURCE_SHA=e50222c43190045902885ee8330bb8dbc6cf6e90')
          PY
          mkdir -p dist
          cp -R qa/v055-data-safety/site/. dist/
          touch dist/.nojekyll
          find dist -type f | sort
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified v05.5 TEST site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish only TEST Pages, not production PWA
        uses: actions/deploy-pages@v4
