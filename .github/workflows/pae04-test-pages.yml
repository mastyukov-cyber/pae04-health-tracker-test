name: PAE-04 TEST v05.2 Journals and Backup GitHub Pages (synthetic only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pae04-test-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-test-site-pages
  cancel-in-progress: false
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout immutable QA-approved v05.2 release snapshot
        uses: actions/checkout@v4
        with:
          ref: '4bb075108e6903dd60e6dccef56b6627089336e9'
          persist-credentials: false
      - name: Verify pinned v05.2 manifest and all 9 SHA256 resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qa/v052-journals-backup/V052_MANIFEST.json)" = "9287b083f68111c679e4a94c4f831076c7104ffa"
          test "$(git hash-object qa/v052-journals-backup/verify.py)" = "424b425944c060966bb5aaae043235d5f9e4b70c"
          python3 qa/v052-journals-backup/verify.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa/v052-journals-backup/site')
          manifest=json.loads(Path('qa/v052-journals-backup/V052_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['version']=='v05.2'
          assert manifest['source_v051']=='d341fc0d7805d2dd2e2881648c3168d9f1ef07e1'
          assert manifest['source_test_main']=='f9258c56271f812e2cff4bcd7b7b6663331bf87b'
          assert len(manifest['sha256'])==9
          html=(root/'index.html').read_text(encoding='utf-8')
          app=(root/'app.js').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          assert 'PAE-04 · v0.2.1 SAFE UX TEST v05.2' in html
          assert 'v0.2.1 · SAFE UX TEST v05.2 · OFFLINE-FIRST' in html
          assert 'id="pressure-search"' in html
          assert 'id="med-search"' in html
          assert 'id="verify-file"' in html
          assert 'JSON не зашифрован' in html
          assert "const DB_NAME='PAE04_HT_STABLE_CANDIDATE_INTEGRATION_SYNTHETIC_SCHEMA1'" in app
          assert "const DB_VERSION=1" in app
          assert "const STORE_NAMES=['pressures','medications','intakes','intakeEvents']" in app
          assert "const BACKUP_VERSION=3" in app
          assert 'function atomicMerge(data)' in app
          assert 'verifyDownloadedBackup' in app
          assert 'cache-v052-20261113' in sw
          print('RESULT=PASS VERSION=v05.2 FILES=9 SHA256_VERIFIED=9 SYNTHETIC_ONLY=True SOURCE_SHA=4bb075108e6903dd60e6dccef56b6627089336e9')
          PY
          mkdir -p dist
          cp -R qa/v052-journals-backup/site/. dist/
          touch dist/.nojekyll
          find dist -type f | sort
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified v05.2 TEST site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish only TEST Pages, not production PWA
        uses: actions/deploy-pages@v4
